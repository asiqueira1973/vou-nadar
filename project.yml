# Projeto do Vou Nadar, gerado por `xcodegen generate`.
#
# O .xcodeproj NÃO é versionado e NUNCA é editado à mão: este arquivo é a fonte
# de verdade da configuração de build (spec 4.3 e critério de aceite 8.1.2).
# XcodeGen é ferramenta de desenvolvimento, não dependência do app — o critério
# 8.1.3 (zero SPM de terceiro) continua valendo e não existe Package.resolved.
#
# Decisões que este arquivo materializa:
#   - quatro targets: iOS 18, watchOS 11, complication e testes (8.1.1)
#   - iPhone apenas, retrato apenas (spec 4.1)
#   - Swift 6 em concorrência estrita, warning como erro (8.1.4)
#   - pt-BR como único idioma (requisito 17.11)
#   - Domain/, Data/Catalog/, Data/Enums/ e Data/Models/ são fontes dos DOIS
#     targets de app, sem Swift Package (spec 4.2 e princípio 0.7)

name: VouNadar

options:
  bundleIdPrefix: com.dablab
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: VouNadar.xcconfig
  Release: VouNadar.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    # O modo de linguagem 6 já implica concorrência estrita; a chave fica
    # explícita para que ninguém a afrouxe sem perceber (critério 8.1.4).
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Isolamento padrão `nonisolated` DE PROPÓSITO, ao contrário do padrão do
    # Xcode 26. O WorkoutGenerator (contrato 13.1) e o RestCalculator (13.2)
    # têm que ser funções puras SEM MainActor, e o CatalogStore é lido de fora
    # da main actor. Quem precisa de MainActor declara: repositórios e UI.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # Build sem nenhum warning é critério de aceite (8.1.4); tratar warning
    # como erro é o que impede que ele seja ignorado.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_MODULE_VERIFIER: NO

# Fontes compartilhadas pelos dois targets de app (spec 4.2).
#
# NÃO HÁ Swift Package: os mesmos arquivos são compilados nos dois lados. É a
# solução mais simples que funciona (princípio 0.7) e evita a cerimônia de um
# package local num projeto de um app só. O que garante que isso continue
# funcionando é o teste de pureza do critério 8.1.7, que reprova qualquer
# import de SwiftUI, HealthKit, UIKit ou WatchKit nestas pastas.
#
# As pastas estão repetidas em cada target de propósito: âncora YAML expandida
# dentro de uma lista produz array aninhado, que o XcodeGen não lê.

targets: iOS 18, watchOS 11, complication e testes (8.1.1)
#   - iPhone apenas, retrato apenas (spec 4.1)
#   - Swift 6 em concorrência estrita, warning como erro (8.1.4)
#   - pt-BR como único idioma (requisito 17.11)
#   - Domain/, Data/Catalog/, Data/Enums/ e Data/Models/ são fontes dos DOIS
#     targets de app, sem Swift Package (spec 4.2 e princípio 0.7)

name: VouNadar

options:
  bundleIdPrefix: com.dablab
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: VouNadar.xcconfig
  Release: VouNadar.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    # O modo de linguagem 6 já implica concorrência estrita; a chave fica
    # explícita para que ninguém a afrouxe sem perceber (critério 8.1.4).
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Isolamento padrão `nonisolated` DE PROPÓSITO, ao contrário do padrão do
    # Xcode 26. O WorkoutGenerator (contrato 13.1) e o RestCalculator (13.2)
    # têm que ser funções puras SEM MainActor, e o CatalogStore é lido de fora
    # da main actor. Quem precisa de MainActor declara: repositórios e UI.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # Build sem nenhum warning é critério de aceite (8.1.4); tratar warning
    # como erro é o que impede que ele seja ignorado.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_MODULE_VERIFIER: NO

# Fontes compartilhadas pelos dois targets de app (spec 4.2).
#
# NÃO HÁ Swift Package: os mesmos arquivos são compilados nos dois lados. É a
# solução mais simples que funciona (princípio 0.7) e evita a cerimônia de um
# package local num projeto de um app só. O que garante que isso continue
# funcionando é o teste de pureza do critério 8.1.7, que reprova qualquer
# import de SwiftUI, HealthKit, UIKit ou WatchKit nestas pastas.
sharedSources: &sharedSources
  - path: VouNadar/Domain
  - path: VouNadar/Data/Catalog
  - path: VouNadar/Data/Enums
  - path: VouNadar/Data/Models
  # Data/Schema/ e Data/Repositories/ acompanham Data/Models/: o relógio tem
  # store SwiftData próprio (critério 8.7) e precisa da mesma declaração de
  # VersionedSchema (spec 7.12) e do mesmo acesso a preferências e treinos.
  # Os três importam apenas Foundation e SwiftData — o teste de pureza 8.1.7
  # verifica.
  - path: VouNadar/Data/Schema

sharedResources: &sharedResources
  - path: VouNadar/Resources/catalogo_exercicios.json
  - path: VouNadar/Resources/tipos_equipamento.json

targets:

  # ---------------------------------------------------------------------------
  # App do iPhone. Retrato apenas, iPhone apenas (spec 4.1).
  # ---------------------------------------------------------------------------
  VouNadar:
    type: application
    platform: iOS
    sources:
      - path: VouNadar
        excludes:
          - "Domain/**"
          - "Data/Catalog/**"
          - "Data/Enums/**"
          - "Data/Models/**"
          - "Data/Schema/**"
          - "Data/Repositories/**"
          - "DesignSystem/Symbols.swift"
          - "Resources/catalogo_exercicios.json"
          - "Resources/tipos_equipamento.json"
      # Fontes compartilhadas (spec 4.2)
      - path: VouNadar/Domain
      - path: VouNadar/Data/Catalog
      - path: VouNadar/Data/Enums
      - path: VouNadar/Data/Models
      - path: VouNadar/Data/Schema
      - path: VouNadar/Data/Repositories
      - path: VouNadar/DesignSystem/Symbols.swift
      # Catálogo embarcado, o mesmo arquivo nos dois targets (critério 8.1.5)
      - path: VouNadar/Resources/catalogo_exercicios.json
      - path: VouNadar/Resources/tipos_equipamento.json
    dependencies:
      - target: VouNadarWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: VouNadar
        # 1 = iPhone. O iPad está descartado no spec 3.2: ninguém leva iPad
        # para a borda da piscina.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: VouNadar/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: VouNadar/Supporting/VouNadar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentTint
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # ---------------------------------------------------------------------------
  # App do Apple Watch. Roda sozinho: gerar, executar, encerrar e gravar
  # funcionam com o iPhone desligado (princípio 0.5).
  # ---------------------------------------------------------------------------
  VouNadarWatch:
    type: application
    platform: watchOS
    sources:
      - path: VouNadarWatch
      # Fontes compartilhadas (spec 4.2)
      - path: VouNadar/Domain
      - path: VouNadar/Data/Catalog
      - path: VouNadar/Data/Enums
      - path: VouNadar/Data/Models
      - path: VouNadar/Data/Schema
      - path: VouNadar/Data/Repositories
      - path: VouNadar/DesignSystem/Symbols.swift
      # Catálogo embarcado, o mesmo arquivo nos dois targets (critério 8.1.5)
      - path: VouNadar/Resources/catalogo_exercicios.json
      - path: VouNadar/Resources/tipos_equipamento.json
    dependencies:
      - target: VouNadarWatchComplication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).watchkitapp
        PRODUCT_NAME: VouNadarWatch
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: VouNadarWatch/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: VouNadarWatch/Supporting/VouNadarWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  # ---------------------------------------------------------------------------
  # Complication (épico 8.12): volume da semana no mostrador.
  # ---------------------------------------------------------------------------
  VouNadarWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: VouNadarWatchComplication
      # A complication roda em OUTRO PROCESSO e não enxerga o app do relógio.
      # Ela precisa de exatamente três arquivos, e só deles:
      #   - a semana da regra 11.16;
      #   - o registro de SF Symbols, para o glyph não virar quadrado vazio;
      #   - o leitor de volume, que lê do HealthKit justamente para não depender
      #     de App Group, que exigiria provisionamento no portal da Apple.
      #
      # **Arquivo por arquivo, não a pasta inteira.** Puxar `Domain/` traria o
      # gerador de treino e o catálogo junto — código que a complication nunca
      # executa, inflando um binário que o sistema carrega no mostrador.
      - path: VouNadar/Domain/Semana.swift
      - path: VouNadar/DesignSystem/Symbols.swift
      - path: VouNadarWatch/Health/WeeklyVolumeReader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).watchkitapp.complication
        PRODUCT_NAME: VouNadarWatchComplication
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: VouNadarWatchComplication/Info.plist
        CODE_SIGN_ENTITLEMENTS: VouNadarWatchComplication/VouNadarWatchComplication.entitlements

  # ---------------------------------------------------------------------------
  # Testes. Rodam contra o app do iPhone, que hospeda as fontes compartilhadas.
  # ---------------------------------------------------------------------------
  VouNadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VouNadarTests
    dependencies:
      - target: VouNadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # Exceção declarada e estreita, só neste target.
        #
        # O critério 8.11 exige testar a compra contra o `.storekit` local, o
        # que obriga a importar `StoreKitTest`. O header desse framework — da
        # Apple, não nosso — usa `SKPaymentTransactionState`, deprecado no
        # iOS 18, e o `GCC_TREAT_WARNINGS_AS_ERRORS` do projeto transforma isso
        # em erro ao pré-compilar o módulo.
        #
        # **`SWIFT_TREAT_WARNINGS_AS_ERRORS` continua ligado aqui**, e os dois
        # continuam ligados nos targets de app: o critério 8.1.4 vale para o
        # código do produto, e nenhum warning nosso é tolerado em lugar nenhum.
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        # O erro acontece quando o **Swift** pré-compila o módulo Clang do
        # framework, então a flag precisa atravessar até o Clang embutido.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-error=deprecated-declarations"

schemes:
  VouNadar:
    build:
      targets:
        VouNadar: all
    run:
      config: Debug
      # Arquivo `.storekit` local (critério 8.11): permite exercitar compra,
      # restauração e falha sem depender do sandbox da App Store.
      storeKitConfiguration: VouNadar/Resources/VouNadar.storekit
    test:
      config: Debug
      gatherCoverageData: true
      storeKitConfiguration: VouNadar/Resources/VouNadar.storekit
      targets:
        - VouNadarTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VouNadarWatch:
    build:
      targets:
        VouNadarWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
