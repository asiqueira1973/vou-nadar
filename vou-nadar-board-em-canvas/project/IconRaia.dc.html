<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{size}}px;height:{{size}}px;font-size:{{fs}}px;background:{{bg}};border-radius:{{radius}};overflow:hidden;display:flex;align-items:center;justify-content:center;gap:30em;">
  <div style="display:flex;flex-direction:column;gap:2.5em;">
    <div style="width:11em;height:11em;border-radius:50%;background:{{ink}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{alt}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{ink}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{alt}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{ink}};"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2.5em;">
    <div style="width:11em;height:11em;border-radius:50%;background:{{alt}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{ink}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{alt}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{ink}};"></div>
    <div style="width:11em;height:11em;border-radius:50%;background:{{alt}};"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:240},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:240,&quot;tsType&quot;:&quot;number&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0E9BC4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFFFF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;rgba(255,255,255,.42)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 240;
    return {
      size,
      fs: size / 100,
      bg: this.props.bg ?? '#0E9BC4',
      ink: this.props.ink ?? '#FFFFFF',
      alt: this.props.alt ?? 'rgba(255,255,255,.42)',
      radius: this.props.clip ? '50%' : '0px'
    };
  }
}

</script>
</body>
</html>
